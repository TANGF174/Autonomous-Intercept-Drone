uav_vision_png:
  ros__parameters:
    # ---- 相机内参（IMX214 可见光相机，双目 OAK-D Lite）----
    # SDF: horizontal_fov=1.204 rad, image=1920x1080
    # focal_length = (width/2) / tan(fov/2) = 960 / tan(0.602) = 1397.2 px
    focal_length: 931.5
    image_width:  1280
    image_height: 720

    # ---- 比例导引参数 ----
    # 导航增益 N（kv/kz），与 los_control.hpp 中 kv=7 kz=7 同量级
    # 垂直增益保持 4.0；高速 10/12 m/s 试验将水平增益降为 2.0，避免横向指令越过目标后方
    N_png: 4.0
    kv:    4.0
    kz:    2.0

    # 按拦截机实际水平速度动态放宽“期望速度方向 - 目标 LOS”夹角。
    # <=8m/s: 30°；8~10m/s: 30°线性增至45°；10m/s~speed_cmd: 45°线性增至55°。
    los_limit_low_speed_mps: 8.0
    los_limit_mid_speed_mps: 10.0
    los_limit_low_angle_deg: 30.0
    los_limit_mid_angle_deg: 45.0
    max_velocity_los_angle_deg: 55.0

    # 首次进入拦截时先贴近 LOS，优先缩小初始横向间隔。
    # 达到退出速度或达到最长时间后，用指定时间平滑恢复上面的动态角度限制。
    # 仅首次拦截启用；飞行中丢失后的重捕获不重复启用。
    initial_los_angle_deg: 15.0
    initial_los_max_duration_s: 1.0
    initial_los_exit_speed_mps: 8.0
    initial_los_transition_duration_s: 0.4

    # 期望冲击速度上限 (m/s)
    speed_cmd: 5.0

    # 速度增量增益，减小可避免急剧加速导致大幅俯仰
    d_gain: 1.8

    # ---- FOV 保持器（主动偏航跟踪）----
    # 将像素误差 ex 转化为偏航角速率 [rad/s]
    # 图像宽 1280px，最大误差 640px，期望画面边缘偏航率约 0.8 rad/s
    # k1_yaw — P 比例项 k2_yaw — D 微分项
    # k1_yaw = 0.8 / 640 = 0.00125
    k1_yaw: 0.00125
    k2_yaw: 0.0002

    # ---- 垂直视场补偿（抵消前飞低头导致相机下倾）----
    # ey<0 表示目标在画面上方，补偿 vz_cmd += k_ey * ey（使无人机上升）
    # 图像高 1080px，最大误差 540px，期望最大补偿 3 m/s（触碰限幅上限）
    # k_ey = 0.012，ey=-300px → 补偿 -3.6m/s（限幅后 -3m/s），强力防止目标跑出画面上方
    k_ey: 0.012

    # ---- 起飞参数 ----
    # NED z（负值 = 上升），目标待机高度 5m
    standby_altitude: -6.0

    # ---- 目标丢失阈值 ----
    # 起飞后的首次拦截必须连续检测到目标；飞行中丢失后的重捕获不使用此等待
    detection_confirm_frames: 5
    # 惯性续飞阈值：丢失帧数低于此值时保持上一帧速度继续飞行（约 0.5s@30Hz检测）
    coast_thresh: 30
    # 悬停阈值：丢失帧数超过此值才真正切换 TRACK_LOST 悬停
    lost_thresh: 90

    # ---- 统计参数 ----
    # 命中判定半径 (m)
    hit_radius: 0.8
    # CSV 输出路径
    csv_path: "/home/verser/ros2_ws/vpng_intercept_stats.csv"
